<!DOCTYPE html>
<html>
<head>
    <title>Student Registration</title>
    <link rel="stylesheet" href="register.css">

    <style>
        body {
            transition: background-color 0.3s, color 0.3s;
        }

        .dark-mode {
            background-color: #121212;
            color: white;
        }

        .dark-mode fieldset {
            border: 1px solid #ffffff;
        }

        .dark-mode input,
        .dark-mode select,
        .dark-mode textarea {
            background-color: #1e1e1e;
            color: white;
            border: 1px solid #555;
        }

        .dark-mode a {
            color: #90caf9;
        }

        #themeToggle {
            position: fixed;
            top: 10px;
            right: 10px;
            padding: 8px 12px;
            cursor: pointer;
            border-radius: 5px;
            border: none;
        }

        .error {
            color: red;
            font-size: 14px;
        }

        .success {
            color: green;
            font-weight: bold;
            text-align: center;
        }
    </style>
</head>

<body>

    <button id="themeToggle">🌙 Dark Mode</button>

    <header>
        <h1 align="center">Student Registration</h1>
        <hr>
        <p align="center">Please fill in the details to register</p>
    </header>

    <main>

        <form id="registerForm">

            <fieldset>
                <legend><h2>Personal Details</h2></legend>

                <p>
                    <label>Full Name:</label><br>
                    <input type="text" id="fullname" placeholder="Enter your full name">
                    <br><span class="error" id="nameError"></span>
                </p>

                <p>
                    <label>Email:</label><br>
                    <input type="email" id="email" placeholder="Enter your email">
                    <br><span class="error" id="emailError"></span>
                </p>

                <p>
                    <label>Enrollment Number:</label><br>
                    <input type="text" id="enrollment" placeholder="Enter enrollment number">
                </p>

                <p>
                    <label>Password:</label><br>
                    <input type="password" id="password" placeholder="Enter password">
                    <button type="button" id="showPassword">Show</button>
                    <br><span class="error" id="passwordError"></span>
                </p>

                <p>
                    <label>Date of Birth:</label><br>
                    <input type="date" id="dob">
                </p>

                <p>
    <label><b>Gender:</b></label><br>

    <label>
        <input type="radio" name="gender" value="Male"> Male
    </label>

    <label style="margin-left:20px;">
        <input type="radio" name="gender" value="Female"> Female
    </label>

    <label style="margin-left:20px;">
        <input type="radio" name="gender" value="Other"> Other
    </label>
</p>

            </fieldset>

            <br>

            <fieldset>
                <legend><h2>Course Details</h2></legend>

                <p>
                    <label>Select Course:</label><br>
                    <select id="course">
                        <option value="">Select Course</option>
                        <option>B.Tech</option>
                        <option>BCA</option>
                        <option>MCA</option>
                        <option>MBA</option>
                    </select>
                </p>

                <p>
                    <label>Hobbies:</label><br>
                    <input type="checkbox"> Reading
                    <input type="checkbox"> Sports
                    <input type="checkbox"> Music
                    <input type="checkbox"> Coding
                </p>

                <p>
                    <label>Address:</label><br>
                    <textarea rows="4" cols="30" placeholder="Enter your address"></textarea>
                </p>

            </fieldset>

            <br>

            <p align="center">
                <input type="submit" value="Register">
                <input type="reset" value="Reset" id="resetBtn">
            </p>

            <p id="successMessage" class="success"></p>

        </form>

    </main>

    <hr>

    <footer>
        <p align="center">
            <a href="page.html">Back to Home</a>
        </p>

        <p align="center">
            Student Registration Portal &copy; 2026
        </p>
    </footer>

    <script>
        // Dark / Light Mode
        const themeToggle = document.getElementById("themeToggle");

        if (localStorage.getItem("theme") === "dark") {
            document.body.classList.add("dark-mode");
            themeToggle.textContent = "☀️ Light Mode";
        }

        themeToggle.addEventListener("click", () => {
            document.body.classList.toggle("dark-mode");

            if (document.body.classList.contains("dark-mode")) {
                localStorage.setItem("theme", "dark");
                themeToggle.textContent = "☀️ Light Mode";
            } else {
                localStorage.setItem("theme", "light");
                themeToggle.textContent = "🌙 Dark Mode";
            }
        });

        // Show / Hide Password
        document.getElementById("showPassword").addEventListener("click", function () {
            const password = document.getElementById("password");

            if (password.type === "password") {
                password.type = "text";
                this.textContent = "Hide";
            } else {
                password.type = "password";
                this.textContent = "Show";
            }
        });

        // Form Validation
        document.getElementById("registerForm").addEventListener("submit", function (e) {
            e.preventDefault();

            let valid = true;

            const name = document.getElementById("fullname").value.trim();
            const email = document.getElementById("email").value.trim();
            const password = document.getElementById("password").value.trim();

            document.getElementById("nameError").textContent = "";
            document.getElementById("emailError").textContent = "";
            document.getElementById("passwordError").textContent = "";
            document.getElementById("successMessage").textContent = "";

            if (name.length < 3) {
                document.getElementById("nameError").textContent = "Name must be at least 3 characters";
                valid = false;
            }

            const emailPattern = /^[^ ]+@[^ ]+\.[a-z]{2,3}$/;
            if (!email.match(emailPattern)) {
                document.getElementById("emailError").textContent = "Enter a valid email address";
                valid = false;
            }

            if (password.length < 6) {
                document.getElementById("passwordError").textContent = "Password must be at least 6 characters";
                valid = false;
            }

            if (valid) {
                document.getElementById("successMessage").textContent = "🎉 Registration Successful!";
                this.reset();
            }
        });

        // Reset Message
        document.getElementById("resetBtn").addEventListener("click", () => {
            document.getElementById("successMessage").textContent = "";
        });
    </script>

</body>
</html>
